<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Lignum Harvester 0.1</title>
<style>
:root{--bg:#0f1f10;--bg2:#162818;--bg3:#1e3520;--surface:#fff;--surface2:#f4f7f4;--surface3:#e8f0e8;--green:#2d6a27;--green-light:#4a9a40;--green-dim:#1a4018;--text:#1a2e1a;--text2:#4a6044;--text3:#8ab882;--border:rgba(45,90,39,.15);--border2:rgba(45,90,39,.25);--radius:12px;--radius-lg:16px;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:linear-gradient(165deg,var(--bg),#081508);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
header{min-height:76px;padding:13px 22px;background:rgba(15,31,16,.96);border-bottom:1px solid rgba(138,184,130,.18);display:flex;align-items:center;justify-content:space-between;color:#c8e6c0}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:var(--green);display:grid;place-items:center;font-size:23px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
h1{font-size:22px;font-weight:500;margin:0}.version{font-size:12px;color:#78a573;font-weight:500}.status{font-size:12px;color:#9bc496;background:var(--bg2);border:1px solid rgba(138,184,130,.2);padding:8px 12px;border-radius:999px}
main{padding:16px;max-width:1500px;margin:auto;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);min-height:220px}
.card h2{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}.big{font-size:46px;line-height:1.05;font-weight:700;color:var(--green-dim);letter-spacing:-1px}.muted{color:var(--text2);font-size:13px}
button,select,input{font:inherit;border-radius:10px}input,select{width:100%;padding:12px 14px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);outline:none}input:focus,select:focus{border-color:var(--green);background:#fff}
button{padding:12px 15px;border:0;background:var(--green);color:#e8f5e4;font-weight:650;cursor:pointer;box-shadow:0 2px 7px rgba(45,106,39,.2)}button:hover{background:var(--green-light)}.full{width:100%;margin-top:9px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.04em}td,th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
.metric{display:flex;gap:26px;align-items:flex-end;margin-bottom:8px}.metric small{font-size:13px;color:var(--text2);font-weight:500}.production-summary{background:var(--surface2);border-radius:10px;padding:10px 12px}
@media(max-width:760px){header{padding:11px 14px}.status{display:none}main{padding:10px}.grid{grid-template-columns:1fr}.card{min-height:0}.big{font-size:38px}}
</style></head>
<body><header><div class="brand"><div class="logo">🌲</div><div><h1>Lignum Harvester</h1><div class="version">Operator · Version 0.1</div></div></div><div id="adapter" class="status"></div></header>
<main><div class="grid"><section class="card"><h2>Auftrag</h2><input id="jobName" value="Sarvisvaara – Testauftrag" class="full"><button id="createJob" class="full">Testauftrag anlegen/aktivieren</button><div id="job"></div></section>
<section class="card"><h2>Aktuelles Stück</h2><div class="metric"><div><small>Durchmesser</small><div class="big"><span id="diameter">—</span> <small>mm</small></div></div><div><small>Länge</small><div class="big"><span id="length">—</span> <small>mm</small></div></div></div><div id="currentAssortment" class="muted">Noch keine Produktion</div></section>
<section class="card"><h2>Sortiment</h2><select id="assortment" class="full"></select><button id="cut" class="full">Schnitt simulieren</button><p class="muted">Nur Simulator. Keine Verbindung zur Maschinensteuerung.</p></section>
<section class="card"><h2>Produktion</h2><div class="production-summary"><b>Stück:</b> <span id="pieces">0</span> &nbsp;&nbsp; <b>Volumen:</b> <span id="volume">0.000</span> m³</div><table><thead><tr><th>Zeit</th><th>Sortiment</th><th>Länge</th><th>Ø</th></tr></thead><tbody id="production"></tbody></table></section></div></main>
<script src="model.js"></script><script src="storage.js"></script><script src="timbermatic-adapter.js"></script><script>
var store=LignumHarvesterStorage.load(),adapter=new LignumTimberMatic.Simulator();
document.getElementById("adapter").textContent=adapter.status().message;
function active(){return store.jobs.find(function(j){return j.id===store.activeJobId;});}
function render(){var j=active(), sel=document.getElementById("assortment");document.getElementById("job").textContent=j?j.name+" – "+j.assortments.length+" Sortimente":"Kein aktiver Auftrag";sel.innerHTML="";
 if(j)j.assortments.forEach(function(a,i){var o=document.createElement("option");o.value=i;o.textContent=a.species+" · "+a.name+" · "+a.lengthsMm.map(function(x){return x/1000+" m";}).join(" / ");sel.appendChild(o);});
 var rows=store.production.filter(function(p){return !j||p.jobId===j.id;});document.getElementById("pieces").textContent=rows.length;document.getElementById("volume").textContent=rows.reduce(function(s,p){return s+p.volumeM3;},0).toFixed(3);
 document.getElementById("production").innerHTML=rows.slice(-8).reverse().map(function(p){return "<tr><td>"+new Date(p.timestamp).toLocaleTimeString()+"</td><td>"+p.species+" "+p.assortment+"</td><td>"+p.lengthMm+"</td><td>"+p.diameterMm+"</td></tr>";}).join("");
}
document.getElementById("createJob").onclick=function(){var j=LignumHarvesterModel.createJob({name:document.getElementById("jobName").value,assortments:[
 {species:"Kiefer",name:"Sägeholz",minDiameterMm:160,maxDiameterMm:500,lengthsMm:[3700,4300,4900],priority:1},
 {species:"Kiefer",name:"Massaved",minDiameterMm:80,maxDiameterMm:300,lengthsMm:[3000],priority:2},
 {species:"Fichte",name:"Sägeholz",minDiameterMm:160,maxDiameterMm:500,lengthsMm:[3700,4300,4900],priority:1}]});store.jobs.push(j);store.activeJobId=j.id;LignumHarvesterStorage.save(store);render();};
document.getElementById("cut").onclick=function(){var j=active();if(!j)return alert("Zuerst Auftrag aktivieren.");var a=j.assortments[Number(document.getElementById("assortment").value||0)],p=adapter.simulatePiece(j,a);store.production.push(p);store.syncQueue.push(p.id);LignumHarvesterStorage.save(store);document.getElementById("diameter").textContent=p.diameterMm;document.getElementById("length").textContent=p.lengthMm;document.getElementById("currentAssortment").textContent=p.species+" · "+p.assortment;render();};render();
</script></body></html>
