name: Probe official P95 source size
on:
  push:
    branches: [lignum-13-63-scan-metadata]
    paths:
      - '.github/workflows/probe-p95.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check P95 official raster archive feed
        run: python tools/probe_p95_data.py
